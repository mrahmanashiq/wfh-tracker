[package]
name = "wt-ui-egui"
description = "egui front end for WFH Tracker. Talks only to wt-core."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eframe.workspace = true
egui.workspace = true
jiff.workspace = true
wt-core.workspace = true

[dev-dependencies]
# `eframe` drives the whole app; `wgpu` + `snapshot` render offscreen PNGs
# for the ignored frame-timing and screenshot tests.
egui_kittest = { workspace = true, features = ["eframe", "wgpu", "snapshot"] }
# Real store in memory for UI tests; the layering check ignores dev-dependencies.
wt-storage.workspace = true

[lints]
workspace = true
