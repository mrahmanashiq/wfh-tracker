[workspace]
resolver = "3"
members = ["crates/core", "crates/storage", "crates/platform", "crates/ui-egui", "apps/wfh-tracker", "xtask"]

[workspace.package]
version = "0.1.10"
edition = "2024"
license = "MIT"
repository = "https://github.com/mrahmanashiq/wfh-tracker"

[workspace.dependencies]
wt-core = { path = "crates/core" }
wt-storage = { path = "crates/storage" }
wt-platform = { path = "crates/platform" }
wt-ui-egui = { path = "crates/ui-egui" }

active-win-pos-rs = "0.11"
arboard = "3.7"
auto-launch = "0.6"
cargo-packager-updater = "0.2.3"
directories = "6.0"
eframe = "0.37"
global-hotkey = "0.9"
egui = "0.37"
egui_kittest = "0.37"
jiff = "0.2"
notify-rust = "4.18"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
thiserror = "2.0"
tray-icon = "0.26"
uuid = { version = "1.28", features = ["v7"] }
winresource = "0.1.34"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
